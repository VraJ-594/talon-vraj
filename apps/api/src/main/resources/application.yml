spring:
  application:
    name: talon-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/talon}
    username: ${DATABASE_USERNAME:talon}
    password: ${DATABASE_PASSWORD:talon_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  application:
    name: Talon ATS API
    version: "@project.version@"

talon:
  files:
    provider: ${TALON_FILES_PROVIDER:local}
    local-root: ${TALON_FILES_LOCAL_ROOT:${java.io.tmpdir}/talon-private-files}
