spring:
  application:
    name: talon-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/talon}
    username: ${DATABASE_USERNAME:talon}
    password: ${DATABASE_PASSWORD:talon_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  application:
    name: Talon ATS API
    version: "@project.version@"

talon:
  files:
    provider: ${TALON_FILES_PROVIDER:local}
    local-root: ${TALON_FILES_LOCAL_ROOT:${java.io.tmpdir}/talon-private-files}
    s3:
      bucket: ${TALON_FILES_S3_BUCKET:}
      region: ${TALON_FILES_S3_REGION:}
  search:
    demo-data:
      enabled: ${TALON_SEARCH_DEMO_DATA_ENABLED:false}
      workspace-slug: ${TALON_SEARCH_DEMO_WORKSPACE_SLUG:${TALON_DEMO_ADMIN_WORKSPACE_SLUG:talon-demo}}
    ai:
      enabled: ${TALON_SEARCH_AI_ENABLED:false}
      api-key: ${GROQ_API_KEY:}
      model: ${TALON_SEARCH_AI_MODEL:openai/gpt-oss-20b}
      endpoint: ${TALON_SEARCH_AI_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
